name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Every release is signed with the same key so each APK installs over the last one.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build release APK
        run: >
          ./gradlew assembleRelease --no-daemon
          -PversionCode=${{ github.run_number }}
          -PversionName=$VERSION

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "wirl-$VERSION.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of the same run number: replace the APK on the existing release.
            gh release upload "$TAG" "wirl-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "wirl-$VERSION.apk" \
              --target "$GITHUB_SHA" \
              --title "Wirl $VERSION" \
              --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
              --latest
          fi
