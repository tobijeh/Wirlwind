name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
      # SHA-256 of the signing certificate. Not secret; it's how we check the right key was used.
      EXPECTED_CERT: 312e6a4c8dcee748713b473130defaa67af68fba9e1ae35a67ac116631d8ae57
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Every release is signed with the same key so each APK installs over the last one.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          WIRL_KEYSTORE="$RUNNER_TEMP/wirl.p12"
          echo "$DEBUG_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$WIRL_KEYSTORE"
          echo "WIRL_KEYSTORE=$WIRL_KEYSTORE" >> "$GITHUB_ENV"

      - name: Build release APK
        run: >
          ./gradlew assembleRelease --no-daemon
          -PversionCode=${{ github.run_number }}
          -PversionName=$VERSION

      - name: Check signing key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)
          echo "Signed with $CERT"
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK is signed with the wrong key ($CERT). Check the DEBUG_KEYSTORE_BASE64 secret."
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "wirl-$VERSION.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of the same run number: replace the APK on the existing release.
            gh release upload "$TAG" "wirl-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "wirl-$VERSION.apk" \
              --target "$GITHUB_SHA" \
              --title "Wirl $VERSION" \
              --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
              --latest
          fi
