name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Sign every build with the same key so new APKs install over old ones.
      # The key lives in the DEBUG_KEYSTORE_BASE64 repo secret (base64 of a debug keystore).
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is missing. This APK uses a one-off key and won't install over an existing Wirl."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Wirl-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
